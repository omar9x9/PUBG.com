<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شكراً للتسجيل</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://wallpaperslinks.com/wp-content/uploads/2024/11/PUBG-Neon-Logo-4K-Mobile-Wallpaper-scaled.jpg') no-repeat center center/cover;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            background: rgba(20,20,30,0.9);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { color: #ff6b6b; font-size: 32px; margin-bottom: 10px; }
        p { color: #ccc; font-size: 18px; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>تم التسجيل بنجاح!</h1>
        <p>شكراً لتسجيلك في بطولة ببجي موبايل.<br>سيتم التواصل معك قريباً عبر البريد الإلكتروني لإرسال شروط المسابقة وتفاصيل اللعب.</p>
        <a href="/" class="btn">🏠 العودة للرئيسية</a>
    </div>
</body>
</html>
